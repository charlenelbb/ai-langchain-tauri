server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;
  client_max_body_size 20m;

  location /cs/ {
    proxy_pass http://api:3000;
    include /etc/nginx/proxy_params.conf;
  }

  location /auth/ {
    proxy_pass http://api:3000;
    include /etc/nginx/proxy_params.conf;
  }

  location /rag/ {
    proxy_pass http://api:3000;
    include /etc/nginx/proxy_params.conf;
  }

  location /sessions {
    proxy_pass http://api:3000;
    include /etc/nginx/proxy_params.conf;
  }

  location /sse/ {
    proxy_pass http://api:3000;
    include /etc/nginx/proxy_params.conf;
    proxy_buffering off;
    proxy_cache off;
    proxy_read_timeout 300s;
    proxy_send_timeout 300s;
  }

  location / {
    try_files $uri $uri/ /index.html;
  }
}
