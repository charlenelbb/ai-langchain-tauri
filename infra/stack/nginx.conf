server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;
  client_max_body_size 20m;

  location = /cs {
    return 301 /cs/;
  }

  # 客服网页。文件在 /usr/share/nginx/html/cs/。接口由 Traefik 直接转发。
  location /cs/ {
    try_files $uri $uri/ /cs/index.html;
  }

  location / {
    return 404;
  }
}
