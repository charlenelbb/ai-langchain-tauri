name: ai-langchain

services:
  db:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: ailangchain
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ai_langchain_db
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ailangchain -d ai_langchain_db"]
      interval: 5s
      timeout: 5s
      retries: 20
    restart: unless-stopped

  api:
    image: ai-langchain-api:latest
    environment:
      DATABASE_URL: postgresql://ailangchain:${POSTGRES_PASSWORD}@db:5432/ai_langchain_db?sslmode=disable
      PORT: "3000"
      DASHSCOPE_BASE_URL: https://dashscope.aliyuncs.com/api/v1
      DASHSCOPE_API_KEY: ${DASHSCOPE_API_KEY}
      AUTH_SECRET: ${AUTH_SECRET}
      CORS_ORIGIN: ${CORS_ORIGIN}
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped

  web:
    image: nginx:1.27-alpine
    ports:
      - "80:80"
    volumes:
      - ./web:/usr/share/nginx/html:ro
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - ./proxy_params.conf:/etc/nginx/proxy_params.conf:ro
    depends_on:
      - api
    restart: unless-stopped

volumes:
  pgdata:
