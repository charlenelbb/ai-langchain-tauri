# 只登记客服自己的路径。别的服务各自提交 Ingress，不改这个文件。
apiVersion: traefik.io/v1alpha1
kind: Middleware
metadata:
  name: strip-api-cs
  namespace: ai-langchain
spec:
  stripPrefix:
    prefixes:
      - /api/cs
---
# SSE 不使用缓冲中间件，响应按块转发。300 秒是等待响应头和空闲连接的上限。
apiVersion: traefik.io/v1alpha1
kind: ServersTransport
metadata:
  name: sse
  namespace: ai-langchain
spec:
  forwardingTimeouts:
    responseHeaderTimeout: 300s
    idleConnTimeout: 300s
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: cs-web
  namespace: ai-langchain
  annotations:
    traefik.ingress.kubernetes.io/router.priority: "10"
spec:
  ingressClassName: traefik
  rules:
    - http:
        paths:
          - path: /cs
            pathType: Prefix
            backend:
              service:
                name: web
                port:
                  number: 80
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: cs-api
  namespace: ai-langchain
  annotations:
    traefik.ingress.kubernetes.io/router.middlewares: ai-langchain-strip-api-cs@kubernetescrd
    traefik.ingress.kubernetes.io/router.priority: "20"
spec:
  ingressClassName: traefik
  rules:
    - http:
        paths:
          - path: /api/cs
            pathType: Prefix
            backend:
              service:
                name: api
                port:
                  number: 3000
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: cs-sse
  namespace: ai-langchain
  annotations:
    traefik.ingress.kubernetes.io/router.middlewares: ai-langchain-strip-api-cs@kubernetescrd
    traefik.ingress.kubernetes.io/service.serverstransport: ai-langchain-sse@kubernetescrd
    traefik.ingress.kubernetes.io/router.priority: "30"
spec:
  ingressClassName: traefik
  rules:
    - http:
        paths:
          - path: /api/cs/sse
            pathType: Prefix
            backend:
              service:
                name: api
                port:
                  number: 3000
