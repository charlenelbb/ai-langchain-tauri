name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: deploy-main
  cancel-in-progress: false

env:
  API_IMAGE: ghcr.io/charlenelbb/ai-langchain-api
  WEB_IMAGE: ghcr.io/charlenelbb/ai-langchain-web
  ECS_HOST: 47.83.153.199

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 12.4.2
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter my-llm-server test:unit

  build:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: servers/my-llm-server/Dockerfile
          platforms: linux/amd64
          push: true
          tags: |
            ${{ env.API_IMAGE }}:${{ github.sha }}
            ${{ env.API_IMAGE }}:main
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: infra/web.Dockerfile
          platforms: linux/amd64
          push: true
          tags: |
            ${{ env.WEB_IMAGE }}:${{ github.sha }}
            ${{ env.WEB_IMAGE }}:main

  deploy:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Copy images onto the ECS and roll out
        env:
          SSH_KEY: ${{ secrets.ECS_SSH_KEY }}
        run: |
          set -eu
          mkdir -p ~/.ssh
          printf '%s\n' "$SSH_KEY" > ~/.ssh/ecs
          chmod 600 ~/.ssh/ecs
          SHA="${{ github.sha }}"
          docker pull "${API_IMAGE}:${SHA}"
          docker pull "${WEB_IMAGE}:${SHA}"
          docker save "${API_IMAGE}:${SHA}" "${WEB_IMAGE}:${SHA}" \
            | ssh -i ~/.ssh/ecs -o StrictHostKeyChecking=accept-new "root@${ECS_HOST}" \
              'k3s ctr images import -'
          ssh -i ~/.ssh/ecs -o StrictHostKeyChecking=accept-new "root@${ECS_HOST}" \
            "k3s ctr images ls | grep -F '${API_IMAGE}:${SHA}' && k3s ctr images ls | grep -F '${WEB_IMAGE}:${SHA}'"
          ssh -i ~/.ssh/ecs -o StrictHostKeyChecking=accept-new "root@${ECS_HOST}" \
            'mkdir -p /opt/ai-langchain/k8s'
          scp -i ~/.ssh/ecs -o StrictHostKeyChecking=accept-new \
            infra/k8s/*.yaml infra/k8s/*.sh \
            "root@${ECS_HOST}:/opt/ai-langchain/k8s/"
          ssh -i ~/.ssh/ecs -o StrictHostKeyChecking=accept-new "root@${ECS_HOST}" \
            "API_IMAGE=${API_IMAGE}:${SHA} WEB_IMAGE=${WEB_IMAGE}:${SHA} bash /opt/ai-langchain/k8s/rollout.sh"
