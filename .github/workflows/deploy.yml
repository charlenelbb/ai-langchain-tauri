name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: deploy-main
  cancel-in-progress: false

env:
  API_IMAGE: ghcr.io/charlenelbb/ai-langchain-api
  WEB_IMAGE: ghcr.io/charlenelbb/ai-langchain-web
  ECS_HOST: 47.83.153.199

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 12.4.2
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter my-llm-server test:unit

  build:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: servers/my-llm-server/Dockerfile
          platforms: linux/amd64
          push: true
          tags: |
            ${{ env.API_IMAGE }}:${{ github.sha }}
            ${{ env.API_IMAGE }}:main
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: infra/web.Dockerfile
          platforms: linux/amd64
          push: true
          tags: |
            ${{ env.WEB_IMAGE }}:${{ github.sha }}
            ${{ env.WEB_IMAGE }}:main
      - name: Make images public
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -eu
          for name in ai-langchain-api ai-langchain-web; do
            gh api --method PATCH "/user/packages/container/${name}" -f visibility=public
          done

  deploy:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Roll out on the existing ECS
        env:
          SSH_KEY: ${{ secrets.ECS_SSH_KEY }}
        run: |
          set -eu
          mkdir -p ~/.ssh
          printf '%s\n' "$SSH_KEY" > ~/.ssh/ecs
          chmod 600 ~/.ssh/ecs
          ssh -i ~/.ssh/ecs -o StrictHostKeyChecking=accept-new "root@${ECS_HOST}" "bash -s" <<EOF
          set -eu
          k3s ctr images pull ${API_IMAGE}:${{ github.sha }}
          k3s ctr images pull ${WEB_IMAGE}:${{ github.sha }}
          kubectl -n ai-langchain set image deployment/api api=${API_IMAGE}:${{ github.sha }}
          kubectl -n ai-langchain set image deployment/web web=${WEB_IMAGE}:${{ github.sha }}
          kubectl -n ai-langchain rollout status deployment/api --timeout=180s
          kubectl -n ai-langchain rollout status deployment/web --timeout=180s
          EOF
